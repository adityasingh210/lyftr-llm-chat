# Render Blueprint for the backend (Dashboard -> New -> Blueprint -> pick this repo).
services:
  - type: web
    name: lyftr-chat-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: free
    envVars:
      - key: LLM_API_KEYS
        sync: false            # set in the dashboard; never committed
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: CACHE_DIR
        value: /data/llm_cache
      - key: ALLOWED_ORIGINS
        sync: false            # e.g. https://your-app.vercel.app
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: LITELLM_LOCAL_MODEL_COST_MAP
        value: "True"
    # A persistent disk keeps /data across deploys (requires a paid instance type):
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
