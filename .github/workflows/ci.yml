name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt ruff==0.11.8 pytest-cov==6.1.1
      - run: ruff check app tests && ruff format --check app tests
      - run: python -m pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker-e2e:
    # Builds the real images and runs the whole stack exactly like `make up`, with the offline
    # mock model (no secrets needed), then checks the API contract and the UI in a real browser.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04's system Python refuses `pip install` (PEP 668), so use a managed one.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Create .env for the mock model
        run: |
          cp .env.example .env
          sed -i 's/^LLM_API_KEYS=.*/LLM_API_KEYS=mock-key-a,mock-key-b/; s#^LLM_MODEL=.*#LLM_MODEL=mock/demo#' .env
      - name: make up
        run: make up && docker compose ps
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do curl -fsS localhost:8000/health && curl -fsS -o /dev/null localhost:3000 && exit 0; sleep 2; done
          docker compose logs; exit 1
      - name: Image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep lyftr
      - name: API contract
        run: python scripts/verify_api.py http://localhost:8000
      - name: UI end-to-end (Playwright)
        run: |
          python -m pip install playwright==1.52.0
          python -m playwright install --with-deps chromium
          python scripts/e2e_ui.py http://localhost:3000 --screenshots e2e-shots
      - name: History survives a restart (named volume)
        run: |
          curl -fsS -XPOST localhost:8000/chat -H 'Content-Type: application/json' \
            -d '{"session_id":"ci-persist","message":"survive the restart"}'
          make down && make up
          for i in $(seq 1 60); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS localhost:8000/sessions/ci-persist/messages | grep -q "survive the restart"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: e2e-screenshots, path: e2e-shots, if-no-files-found: ignore }
      - if: failure()
        run: docker compose logs
      - if: always()
        run: make clean
